<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <a href="#konten-utama" class="skip-link">Lewati ke konten utama</a>

    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__kicker">{{KICKER}}</span>
        <h1 class="app-header__title">{{H1}}</h1>
      </div>
      <div class="app-header__actions">
        <button type="button" id="resetAppBtn" class="btn btn--ghost btn--small">Reset</button>
        <a href="../../index.html" class="btn btn--ghost btn--small">Beranda</a>
      </div>
    </header>

    <nav class="stage-nav" aria-label="Tahapan pembelajaran">
      <ol class="stage-nav__list" id="stageNavList">
        <!-- Diisi oleh app.js -->
      </ol>
    </nav>

    <main id="konten-utama">
      <div class="progress-bar-wrap">
        <div class="progress-bar-label">
          <span id="progressLabel">0 dari {{STAGE_COUNT}} tahap selesai</span>
          <span style="font-size: 0.78rem; color: var(--color-ink-muted)">
            Progress disimpan otomatis
          </span>
        </div>
        <div
          class="progress-bar"
          role="progressbar"
          aria-label="Progress pembelajaran"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-bar__fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>

      <div id="stageContainer">
        <p style="text-align: center; padding: var(--space-7); color: var(--color-ink-muted)">
          Memuat media pembelajaran…
        </p>
      </div>
    </main>

    <div class="app-notice" id="appNotice" role="status" aria-live="polite"></div>
    {{EXTRA_BODY}}
    <script src="../../shared/engine.js"></script>
    <script src="data.js"></script>
    {{EXTRA_SCRIPTS}}
    <script src="app.js"></script>
  </body>
</html>
