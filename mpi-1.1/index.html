<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsep Dasar Basis Data Relasional — Rekayasa Perangkat Lunak Fase F</title>
  <meta name="description"
    content="Media pembelajaran interaktif untuk memahami konsep dasar basis data relasional dan pentingnya perancangan struktur data.">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <a href="#konten-utama" class="skip-link">Lewati ke konten utama</a>

  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__kicker">Rekayasa Perangkat Lunak — Fase F</span>
      <h1 class="app-header__title">Konsep Dasar Basis Data Relasional</h1>
    </div>
    <div class="app-header__actions">
      <button type="button" id="resetAppBtn" class="btn btn--ghost btn--small">Reset</button>
      <a href="../index.html" class="btn btn--ghost btn--small">Beranda</a>
    </div>
  </header>

  <nav class="stage-nav" aria-label="Tahapan pembelajaran">
    <ol class="stage-nav__list" id="stageNavList">
      <!-- Diisi oleh app.js -->
    </ol>
  </nav>

  <main id="konten-utama">
    <div class="progress-bar-wrap">
      <div class="progress-bar-label">
        <span id="progressLabel">0 dari 8 tahap selesai</span>
        <span class="progress-bar-note">Progress disimpan otomatis</span>
      </div>
      <div class="progress-bar" role="progressbar" aria-label="Progress pembelajaran">
        <div class="progress-bar__fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div id="stageContainer">
      <p class="loading-state">Memuat media pembelajaran…</p>
    </div>
  </main>

  <div class="app-notice" id="appNotice" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>

</html>
